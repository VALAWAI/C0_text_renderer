<div class="max-w-4xl mx-auto p-4 flex flex-col gap-4">
    @if (loading()) {
    <div class="w-full">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    } @else if (text(); as t) {
    <div class="p-4 mb-4 text-yellow-800 border border-yellow-300 rounded-lg bg-yellow-50 dark:bg-gray-800 dark:text-yellow-300 dark:border-yellow-800" role="alert">
        <div class="flex items-center gap-2 text-lg font-medium"
            i18n="The title to confirm the delete text@@main_texts_delete_msg-title">
            <mat-icon class="text-yellow-700 dark:text-yellow-400">warning</mat-icon>
            <span>Delete text <span class="font-bold">{{ t.title || ('#' + t.id) }}</span></span>
        </div>

        <div class="mt-2 mb-4 text-sm"
            i18n="The message to confirm delete text@@main_texts_delete_msg-content">
            Deleting a received text cannot be undone, so don't do it unless you're sure.
        </div>

        @if (error()) {
        <div class="mb-3 text-sm text-red-600 dark:text-red-400 font-medium">
            {{ error() }}
        </div>
        }

        <div class="flex items-center gap-2">
            <button type="button"
                class="text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-xs px-3 py-1.5 text-center inline-flex items-center dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-900 disabled:opacity-50"
                [disabled]="deleting()"
                (click)="confirmDelete()"
                i18n="Accept to delete text@@main_texts_delete_ok-label">
                Delete
            </button>
            <button type="button"
                class="text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-xs px-3 py-1.5 text-center dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700"
                routerLink="/main/texts"
                i18n="Cancel delete text@@main_texts_delete_cancel-label">
                Cancel
            </button>
        </div>
    </div>
    } @else if (error()) {
    <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400 border border-red-200 dark:border-red-800" role="alert">
        <div class="flex items-center gap-2">
            <mat-icon>error_outline</mat-icon>
            <span class="font-medium">{{ error() }}</span>
        </div>
        <div class="mt-3">
            <a routerLink="/main/texts"
                class="text-sm underline hover:no-underline"
                i18n="Back to texts link@@main_texts_delete_back-to-list">
                Back to texts
            </a>
        </div>
    </div>
    }
</div>
